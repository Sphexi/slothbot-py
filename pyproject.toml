[project]
name = "slothbot"
version = "2.0.0"
description = "Discord bot that automatically manages channel slowmode"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "discord.py==2.7.1",
    "pydantic-settings==2.16.3",
]

[project.scripts]
slothbot = "slothbot.main:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slothbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
