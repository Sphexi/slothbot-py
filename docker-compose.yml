services:
  slothbot:
    # Pin to a digest or a sha-<commit> tag for a deployment you want to be reproducible.
    image: ghcr.io/sphexi/slothbot:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - slothbot-data:/var/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  slothbot-data:
